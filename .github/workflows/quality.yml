name: Quality

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: quality (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install native test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            bubblewrap \
            dbus-x11 \
            desktop-file-utils \
            gir1.2-ayatanaappindicator3-0.1 \
            gir1.2-gtk-3.0 \
            libgl1-mesa-dri \
            libglib2.0-bin \
            libgtk-3-bin \
            python3-gi \
            python3-venv \
            shellcheck \
            xvfb

      - name: Install pinned Python quality tools
        run: |
          python3 -m venv --system-site-packages .quality-venv
          .quality-venv/bin/python -m pip install --disable-pip-version-check ruff==0.16.4
          echo "$GITHUB_WORKSPACE/.quality-venv/bin" >> "$GITHUB_PATH"

      - name: Allow the bubblewrap test sandbox on Ubuntu 24.04
        if: matrix.os == 'ubuntu-24.04'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Run the blocking quality gate
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: scripts/quality-gate.sh

      - name: Upload exact-SHA quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-gate-${{ matrix.os }}
          path: .release/evidence/quality-gate.json
          if-no-files-found: error
          retention-days: 14
